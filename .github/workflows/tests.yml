name: Companion Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run basic structure tests
        run: |
          # Test that companion_core exists and can be imported
          python -c "from src.companion_core import Companion; c = Companion(); print(c.name); print('✅ Core loaded successfully')"
      
      - name: Test Resurrection Protocol
        run: |
          python -c "from src.resurrection_protocol import PROTOCOL_VERSION; print(f'Protocol version: {PROTOCOL_VERSION}'); print('✅ Protocol loaded successfully')"
